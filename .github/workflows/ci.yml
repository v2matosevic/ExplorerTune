name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    name: Parse + PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse every script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1, *.psd1 | ForEach-Object {
              $errs = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
              if ($errs.Count) {
                  $bad++
                  Write-Host "::error file=$($_.FullName)::parse errors"
                  $errs | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              }
              else { Write-Host "ok  $($_.Name)" }
          }
          if ($bad) { throw "$bad file(s) failed to parse" }

      - name: Config and catalog load
        shell: pwsh
        run: |
          . .\lib\Config.ps1
          $cfg = Get-ETConfig
          if (-not $cfg.Search.NoiseDirs) { throw 'config did not load' }
          $cat = Get-ETHandlerCatalog
          if ($cat.Count -lt 1) { throw 'catalog did not load' }
          Write-Host "config ok, $($cat.Count) catalog entries"

          # Catalog hygiene: unique ids, required fields present.
          $ids = @($cat | ForEach-Object { $_.Id })
          $dupes = @($ids | Group-Object | Where-Object Count -gt 1 | ForEach-Object Name)
          if ($dupes) { throw "duplicate catalog id(s): $($dupes -join ', ')" }
          foreach ($h in $cat) {
              foreach ($f in 'Id', 'Label', 'Kind', 'Cost') {
                  if (-not $h.$f) { throw "catalog entry '$($h.Id)' is missing $f" }
              }
              if ($h.Dll -and ($h.Dll | Where-Object { $_ -match '[\/]' })) {
                  throw "catalog entry '$($h.Id)' has a path in Dll; use file names only"
              }
          }
          Write-Host 'catalog hygiene ok'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $blocking = @($r | Where-Object Severity -in 'Error', 'Warning')
          if ($blocking.Count) { throw "$($blocking.Count) analyser error(s)/warning(s)" }

      - name: Dry runs must not write
        shell: pwsh
        run: |
          # A bare invocation must change nothing. If a backups/ directory
          # appears, something wrote without -Apply and that is a release blocker.
          .\Optimize-Explorer.ps1 -List
          .\Optimize-Explorer.ps1
          if (Test-Path .\backups) { throw 'a dry run created backups/ - it wrote something' }
          Write-Host 'dry runs are clean'

  no-secrets:
    name: No machine-specific data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Nothing machine-specific is tracked
        shell: bash
        run: |
          fail=0

          note() { echo "::error::$1"; fail=1; }

          # git grep is used throughout rather than `grep`, because only git
          # understands :(exclude) pathspecs and only git limits the search to
          # TRACKED files. A plain grep with a git pathspec silently errors out
          # and checks nothing, which is worse than no check at all.
          #
          # This workflow is excluded from the content scans: it necessarily
          # contains the patterns it is looking for.
          EX=(':(exclude).github/workflows/*')

          # 1. Files that must never be tracked at all.
          for f in explorertune.config.psd1; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              note "$f is tracked; it must stay gitignored"
            fi
          done
          for d in backups logs; do
            if [ -n "$(git ls-files "$d/")" ]; then
              note "$d/ has tracked files; it must stay gitignored"
            fi
          done

          # 2. A concrete user profile path. %USERPROFILE% and $env:USERPROFILE
          #    are the portable forms and are expected.
          # '.' matches the path separator, which avoids backslash escaping that
          # breaks differently in every shell layer between here and git.
          if git grep -nIE 'C:.Users.[A-Za-z0-9._-]+' -- "${EX[@]}" ':(exclude)*.md' | grep -v 'USERPROFILE'; then
            note "a literal user profile path is committed; use %USERPROFILE%"
          fi

          # 3. A user or group SID.
          if git grep -nIE 'S-1-5-21-[0-9]' -- "${EX[@]}"; then
            note "a SID is committed"
          fi

          # 4. Full GUIDs. Documented COM CLSIDs/IIDs are the only ones that
          #    belong in the tree; a volume GUID identifies a machine.
          if git grep -nIE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' -- "${EX[@]}"                | grep -viE 'AB310581-AC80-11D1-8DF3-00C04FB6|7D096C5F-AC08-4F1F-BEB7-5C22C517CE39|E6FB5E20-DE35-11CF-9C87-00AA005127ED'; then
            note "an unexplained GUID is committed; only documented COM ids are allowlisted"
          fi

          # 5. The machine this was developed on.
          if git grep -nIEi 'rayzen' -- "${EX[@]}"; then
            note "a hostname is committed"
          fi

          if [ "$fail" = "0" ]; then echo "clean"; fi
          exit $fail
